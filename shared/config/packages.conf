# shared/config/packages.conf — common package lists for debian-slim-rescue
#
# Format: one package per line, comments with #
# Used by both minbian (post-install setup) and minidebian (rescue initramfs)

# ── Base packages (all modes) ─────────────────────────────────────────────────
BASE_PACKAGES="
  bash
  busybox
  coreutils
  curl
  wget
  ca-certificates
  gnupg
  lsb-release
  sudo
  systemd
  udev
"

# ── Rescue/initramfs packages (minidebian mode) ───────────────────────────────
RESCUE_PACKAGES="
  busybox-static
  klibc-utils
  zstd
  xz-utils
  fdisk
  parted
  e2fsprogs
  btrfs-progs
  dosfstools
  cryptsetup
  lvm2
  mdadm
  openssh-client
  rsync
  pv
"

# ── RAM-boot packages (ramboot mode) ─────────────────────────────────────────
RAMBOOT_PACKAGES="
  zram-tools
  dracut
  dracut-core
  dracut-network
"

# ── Desktop packages (minbian mode) ──────────────────────────────────────────
DESKTOP_BASE="
  xorg
  lightdm
  openbox
  tint2
  pcmanfm
  lxterminal
  mousepad
  network-manager
  network-manager-gnome
  pulseaudio
  pavucontrol
  gvfs
  gvfs-backends
  udisks2
  policykit-1
"

DESKTOP_LOW_RAM="
  openbox
  tint2
  lxterminal
  pcmanfm
"

DESKTOP_DEV="
  git
  vim
  build-essential
  python3
  python3-pip
  nodejs
  npm
"
